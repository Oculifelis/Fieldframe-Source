org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.101
# Lowest NeoForge build this edition is tested against (see docs/compatibility_matrix.md).
neo_min_version=26.3.0.76
loader_version_range=[1,)

# Optional integration (compile-only; never a required runtime dependency). Marked beta upstream.
kubejs_version=26.1.2-8.0.7
rhino_version=2101.2.8-build.91

mod_id=fieldframe
mod_name=Fieldframe
mod_license=LGPL-3.0-or-later
mod_version=0.3.7
mod_group_id=dev.fieldframe

# Metallurgy 4: Reforged (required). Dev runs load the jar from metallurgy_dir (override with -Pmetallurgy_dir=...).
metallurgy_version=1.4.4
metallurgy_dir=../libs/metallurgy

# Optional viewers: JEI and Jade (compileOnly; dev runs load them with -PwithViewers).
jei_version=31.17.0.108
jade_version=26.3.5+neoforge
# Optional: Ponder scenes (compileOnly; dev runs load it with -PwithPonder). Pulls catnip and Flywheel.
ponder_version=1.0.52+mc26.1.2
curios_version=17.0.0+26.3
# Required: Fundamentum supplies the cord whips and Graviton Hook.
fundamentum_version=1.30.0+26.3
