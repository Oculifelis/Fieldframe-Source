org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.262
# Metallurgy 1.4.1-port.7 requires exactly this NeoForge build.
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Optional integration (compile-only; never a required runtime dependency)
kubejs_version=2101.7.2-build.377
rhino_version=2101.2.7-build.81

mod_id=fieldframe
mod_name=Fieldframe
mod_license=LGPL-3.0-or-later
mod_version=0.3.7
mod_group_id=dev.fieldframe

# Metallurgy 4: Reforged (required). Dev runs load the jar from metallurgy_dir (override with -Pmetallurgy_dir=...).
metallurgy_version=1.4.4
metallurgy_dir=../libs/metallurgy

# Optional viewers: JEI and Jade (compileOnly; dev runs load them with -PwithViewers).
jei_version=19.64.0.455
jade_version=15.10.6+neoforge
# Optional: Curios (the Field Kit belt slot; compileOnly, dev runs load it with -PwithCurios).
curios_version=9.5.1+1.21.1
# Optional: Ponder scenes (compileOnly; client dev runs load it with -PwithPonder). Catnip is bundled in the jar.
ponder_version=1.0.87+mc1.21.1
# Required: Fundamentum supplies the cord whips and Graviton Hook.
fundamentum_version=1.30.0+1.21.1
