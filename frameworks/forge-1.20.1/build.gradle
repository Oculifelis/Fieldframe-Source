// Fieldframe Frameworks (Forge 1.20.1; derived from the 26.1.2 edition by tools/port_frameworks.py). Builds against the
// published Fieldframe artifact; 'checkApiOnly' fails the build if any internal Fieldframe package is used.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = '0.1.6+1.20.1-forge'
group = 'dev.fieldframe'
base { archivesName = 'fieldframe-frameworks' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    // Run `./gradlew publish` in ../../forge-1.20.1 first.
    maven { url = file('../../repo') }
    flatDir { dirs project.property('metallurgy_dir') }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    mavenCentral()
}

legacyForge {
    version = '1.20.1-47.4.28'
    parchment {
        minecraftVersion = '1.20.1'
        mappingsVersion = '2023.09.03'
    }
    runs {
        configureEach {
            // Metallurgy's mixins carry production-name refmaps; remap them to dev names (as Fieldframe's own build does).
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', file('build/moddev/artifacts/intermediateToNamed.srg').absolutePath
        }
        client {
            client()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'forge.enabledGameTestNamespaces', 'fieldframe_frameworks'
        }
    }
    mods {
        fieldframe_frameworks {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    modImplementation "dev.fieldframe:fieldframe-forge-1.20.1:${fieldframe_version}"
    // Fieldframe requires Metallurgy: Recast; dev runs need its jar.
    modRuntimeOnly "local.metallurgy:metallurgy-recast-1.20.1-forge:${metallurgy_version}"
    // JEI: optional, isolated in compat.jei. -PwithViewers loads it in dev runs.
    modCompileOnly "mezz.jei:jei-1.20.1-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    if (project.hasProperty('withViewers')) {
        modRuntimeOnly "mezz.jei:jei-1.20.1-forge:${jei_version}"
    }
    // Unit tests of the loader-independent models (the Starcore's plasma).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // The unit tests use the loader-free JSON code (FwTuning, ArcAlloys); Gson is otherwise on the game classpath.
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

sourceSets.main.resources {
    srcDir 'shared'
    srcDir 'src/generated/resources'
}

tasks.register('checkApiOnly') {
    def src = fileTree('src/main/java')
    inputs.files(src)
    doLast {
        def bad = []
        src.each { f ->
            f.eachLine { line ->
                def m = line =~ /^import\s+(static\s+)?(dev\.fieldframe\.[\w.]+)/
                if (m && !(m[0][2].startsWith('dev.fieldframe.api.') || m[0][2].startsWith('dev.fieldframe.forge.api.')
                        || m[0][2].startsWith('dev.fieldframe.frameworks.'))) {
                    bad << "${f.name}: ${m[0][2]}"
                }
            }
            f.eachLine { line ->
                def q = line =~ /(dev\.fieldframe\.(core|forge\.(?!api)[a-z]+)\.[\w.]+)/
                if (q && !line.trim().startsWith('//') && !line.trim().startsWith('*')) {
                    bad << "${f.name}: ${q[0][1]}"
                }
            }
        }
        if (bad) {
            throw new GradleException("Addon imports internal Fieldframe packages:\n" + bad.join('\n'))
        }
        println "checkApiOnly: only public Fieldframe API packages are imported"
    }
}
compileJava.dependsOn 'checkApiOnly'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-removal'
}

// LGPL-3.0-or-later code: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([file('../LICENSE'), file('../COPYING'), file('../CREDITS.md')]) {
        into 'META-INF'
    }
}
