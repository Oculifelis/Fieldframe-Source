// Fieldframe Frameworks (NeoForge 1.21.1; derived from the 26.1.2 edition by tools/port_frameworks.py): multiblock frames built on Fieldframe's public API. Builds against the
// published Fieldframe artifact; the 'checkApiOnly' task fails the build if any internal Fieldframe package is
// imported, so everything here is possible for any addon.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.6+1.21.1-neoforge'
group = 'dev.fieldframe'
base { archivesName = 'fieldframe-frameworks' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Run `./gradlew publish` in ../../neoforge-1.21.1 first.
    maven { url = file('../../repo') }
    // JEI (optional integration; compiled against, never bundled).
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    mavenCentral()
}

sourceSets.main.resources {
    srcDir 'shared'
    srcDir 'src/generated/resources'
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fieldframe_frameworks'
        }
    }
    mods {
        fieldframe_frameworks {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.fieldframe:fieldframe-neoforge-1.21.1:${fieldframe_version}"
    // Fieldframe requires Metallurgy 4: Reforged; dev runs need its jar.
    localRuntime files("${metallurgy_dir}/Metallurgy-Reforged-MC-1.21.1-neoforge-${metallurgy_version}.jar")
    // JEI: optional, isolated in compat.jei. -PwithViewers loads it in dev runs.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    if (project.hasProperty('withViewers')) {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    }
    // Unit tests of the loader-independent models (the Starcore's plasma).
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Minecraft ships Gson at runtime; plain unit tests (FwTuning) need it on their own classpath.
    testRuntimeOnly 'com.google.code.gson:gson:2.11.0'
}

test {
    useJUnitPlatform()
}

tasks.register('checkApiOnly') {
    def src = fileTree('src/main/java')
    inputs.files(src)
    doLast {
        def bad = []
        src.each { f ->
            f.eachLine { line ->
                def m = line =~ /^import\s+(static\s+)?(dev\.fieldframe\.[\w.]+)/
                if (m && !(m[0][2].startsWith('dev.fieldframe.api.') || m[0][2].startsWith('dev.fieldframe.neoforge.api.')
                        || m[0][2].startsWith('dev.fieldframe.frameworks.'))) {
                    bad << "${f.name}: ${m[0][2]}"
                }
            }
            // Fully qualified uses count too.
            f.eachLine { line ->
                def q = line =~ /(dev\.fieldframe\.(core|neoforge\.(?!api)[a-z]+)\.[\w.]+)/
                if (q && !line.trim().startsWith('//') && !line.trim().startsWith('*')) {
                    bad << "${f.name}: ${q[0][1]}"
                }
            }
        }
        if (bad) {
            throw new GradleException("Frameworks uses internal Fieldframe packages:\n" + bad.join('\n'))
        }
        println "checkApiOnly: only public Fieldframe API packages are used"
    }
}
compileJava.dependsOn 'checkApiOnly'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// LGPL-3.0-or-later code: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([file('../LICENSE'), file('../COPYING'), file('../CREDITS.md')]) {
        into 'META-INF'
    }
}
