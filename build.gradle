plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}-neoforge"
group = mod_group_id
base { archivesName = mod_id }

// Minecraft 26.1 ships Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Shared loader-independent domain model and logical API.
sourceSets.main.java.srcDir 'common/src/main/java'
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir 'shared'
}

// Classic EnderTech/FLORA textures (shared-classic/, see its NOTICE.txt) replace the generated ones of the same name.
// -PnoClassicTextures builds without them.
def classicDir = file('shared-classic')
def useClassic = !project.hasProperty('noClassicTextures') && classicDir.isDirectory()
if (useClassic) {
    sourceSets.main.resources.srcDir classicDir
    def overridden = fileTree(classicDir).files.collect { classicDir.toPath().relativize(it.toPath()).toString().replace(File.separator, '/') } as Set
    tasks.matching { it.name == 'processResources' || it.name == 'sourcesJar' }.configureEach {
        inputs.dir classicDir
        eachFile { d ->
            def rel = d.relativePath.pathString
            if (overridden.contains(rel) && !d.file.toPath().startsWith(classicDir.toPath())) {
                d.exclude()
            }
        }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'fieldframe.clientSmoke', project.hasProperty('clientSmoke') ? 'true' : 'false'
            // ./gradlew runClient -PwithPonder -PponderSmoke : new flat single-player world, opens a Ponder scene, screenshots, quits.
            systemProperty 'fieldframe.ponderSmoke', project.hasProperty('ponderSmoke') ? 'true' : 'false'
            systemProperty 'fieldframe.fluidSmoke', project.hasProperty('fluidSmoke') ? 'true' : 'false'
            // ./gradlew runClient -PmpSmoke : joins the local mpSmoke server, runs the client checks, quits.
            systemProperty 'fieldframe.mpSmoke', project.hasProperty('mpSmoke') ? 'client' : ''
            if (project.hasProperty('mpSmoke')) {
                programArguments.addAll '--quickPlayMultiplayer', 'localhost:25572', '--width', '1280', '--height', '720'
                if (project.hasProperty('mpUser')) {
                    programArguments.addAll '--username', project.property('mpUser')
                }
            }
        }
        server {
            server()
            programArgument '--nogui'
            // ./gradlew runServer -PmpSmoke : dedicated server half of the two-process multiplayer smoke test.
            systemProperty 'fieldframe.mpSmoke', project.hasProperty('mpSmoke') ? 'server' : ''
            gameDirectory = project.file('run-server')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // JEI and Jade (optional integrations; compiled against, never bundled).
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.latvian.dev/releases'; content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' } }
    maven { url = 'https://jitpack.io'; content { includeGroup 'com.github.rtyley' } }
    // Ponder (optional; compiled against, never bundled) with its catnip and Flywheel libraries.
    maven { url = 'https://maven.createmod.net'; content { includeGroup 'net.createmod.ponder'; includeGroup 'net.createmod.catnip'; includeGroup 'dev.engine-room.flywheel' } }
    maven { url = 'https://maven.theillusivec4.top/'; content { includeGroup 'top.theillusivec4.curios' } }
    // Fundamentum is required for the electric whips and hook.
    maven { url = 'file:///H:/AI_MC_Modding/Fundamentum/repo'; content { includeGroup 'com.fundamentum' } }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI and Jade: optional, isolated in compat.jei / compat.jade. -PwithViewers loads both in dev runs.
    compileOnly "mezz.jei:jei-26.2-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-26.2-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    if (project.hasProperty('withViewers')) {
        localRuntime "mezz.jei:jei-26.2-neoforge:${jei_version}"
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    // Curios supplies the Field Kit slot and Fundamentum gear slots.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Fundamentum is required at compile time and runtime.
    implementation "com.fundamentum:fundamentum-neoforge:${fundamentum_version}"
    // Ponder: optional, isolated in compat.ponder (scenes are resource files). -PwithPonder loads it in dev runs.
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    compileOnly("net.createmod.catnip:catnip-neoforge:${ponder_version}") { transitive = false }
    // Client runs only: on a dedicated server catnip 1.0.52 (26.2) breaks every join ("Unrecognized argument type
    // ConfigPathArgument" in the command tree), and scenes are client-side anyway.
    if (project.hasProperty('withPonder') && !ponder_version.contains('mc' + minecraft_version)) {
        throw new GradleException('Select a matching Ponder build for this Minecraft edition before enabling withPonder')
    }
    if (project.hasProperty('withPonder') && !gradle.startParameter.taskNames.any { it.toLowerCase().contains('server') }) {
        localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}"
    }
    // -PwithClaims: dev runs also load a real claim mod (FTB Chunks + FTB Teams + FTB Library jars, put in
    // run-claims/ or -Pclaims_dir=...) for the claim GameTest. Never shipped or compiled against.
    if (project.hasProperty('withClaims')) {
        def claims = fileTree(project.findProperty('claims_dir') ?: 'run-claims') { include '*.jar' }
        if (claims.isEmpty()) {
            throw new GradleException("-PwithClaims: no claim mod jars in run-claims/ (or -Pclaims_dir)")
        }
        localRuntime claims
    }
    // -PwithFrameworks: dev runs also load the Frameworks addon jar (build it first in frameworks/neoforge-26.2).
    if (project.hasProperty('withFrameworks')) {
        def fw = fileTree("frameworks/neoforge-26.2/build/libs") { include 'fieldframe-frameworks-*.jar'; exclude '*-sources.jar' }
        if (fw.isEmpty()) {
            throw new GradleException("-PwithFrameworks: no addon jar in frameworks/neoforge-26.2/build/libs (run its build first)")
        }
        localRuntime fw
    }
    // Metallurgy 4: Reforged is a required dependency (metals, ores, dusts). Dev runs need its jar.
    def metallurgyJar = file("${metallurgy_dir}/metallurgy-recast-${minecraft_version}-neoforge-${metallurgy_version}.jar")
    if (!metallurgyJar.exists()) metallurgyJar = file("${metallurgy_dir}/Metallurgy-Reforged-MC-${minecraft_version}-neoforge-${metallurgy_version}.jar")
    if (metallurgyJar.exists()) {
        localRuntime files(metallurgyJar)
    } else {
        logger.warn("Fieldframe: Metallurgy jar not found at ${metallurgyJar}; dev runs will stop at the missing dependency")
    }
    // KubeJS is optional: compiled against, isolated in dev.fieldframe.neoforge.compat.kubejs.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    if (project.hasProperty('withKubeJS') && !kubejs_version.startsWith(minecraft_version + '-')) {
        throw new GradleException('Select a matching KubeJS build for this Minecraft edition before enabling withKubeJS')
    }
    if (project.hasProperty('withKubeJS')) {
        localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            metallurgy_version     : metallurgy_version,
            neo_version            : neo_version,
            neo_min_version        : project.findProperty("neo_min_version") ?: neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-removal'
}

java { withSourcesJar() }

// Dev-only test helper (stops smoke clients grabbing the mouse): never in the release jar.
tasks.named('jar') { exclude 'dev/fieldframe/neoforge/client/DevNoGrab*' }
tasks.named('sourcesJar') { exclude 'dev/fieldframe/neoforge/client/DevNoGrab*' }

tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    from(sourceSets.main.output) {
        include 'dev/fieldframe/api/**'
        include 'dev/fieldframe/neoforge/api/**'
    }
}
assemble.dependsOn 'apiJar'

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = 'fieldframe-neoforge-26.2'
            from components.java
        }
    }
    repositories { maven { url = file('../repo') } }
}

tasks.register('syncExampleKubeJS', Copy) {
    from 'examples/kubejs-26.2/kubejs'
    into 'run/kubejs'
}
if (project.hasProperty('withKubeJS')) {
    tasks.matching { it.name.startsWith('prepare') && it.name.endsWith('Run') }.configureEach { dependsOn 'syncExampleKubeJS' }
}

// LGPL-3.0-or-later code: the licence texts and credits ship in the jar's META-INF
tasks.named('jar') {
    from([file('LICENSE'), file('COPYING'), file('CREDITS.md')]) {
        into 'META-INF'
    }
}
