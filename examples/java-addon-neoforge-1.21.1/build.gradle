// Example external addon for Fieldframe (NeoForge 1.21.1). Builds against the published Fieldframe artifact and
// uses only the public API packages (dev.fieldframe.api.*, dev.fieldframe.neoforge.api.*). The 'checkApiOnly'
// task fails the build if any internal Fieldframe package is imported.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '0.1.0'
group = 'dev.fieldframe_example'
base { archivesName = 'fieldframe-example-addon' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Run `./gradlew publish` in ../../neoforge-1.21.1 first.
    maven { url = file('../../repo') }
}

neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }
    runs {
        client {
            client()
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'fieldframe_example'
        }
    }
    mods {
        fieldframe_example {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "dev.fieldframe:fieldframe-neoforge-1.21.1:${fieldframe_version}"
    // Fieldframe requires Metallurgy 4: Reforged; dev runs need its jar.
    localRuntime files("${metallurgy_dir}/Metallurgy-Reforged-MC-1.21.1-neoforge-${metallurgy_version}.jar")
}

tasks.register('checkApiOnly') {
    def src = fileTree('src/main/java')
    inputs.files(src)
    doLast {
        def bad = []
        src.each { f ->
            f.eachLine { line ->
                def m = line =~ /^import\s+(static\s+)?(dev\.fieldframe\.[\w.]+)/
                if (m && !(m[0][2].startsWith('dev.fieldframe.api.') || m[0][2].startsWith('dev.fieldframe.neoforge.api.'))) {
                    bad << "${f.name}: ${m[0][2]}"
                }
            }
        }
        if (bad) {
            throw new GradleException("Addon imports internal Fieldframe packages:\n" + bad.join('\n'))
        }
        println "checkApiOnly: only public Fieldframe API packages are imported"
    }
}
compileJava.dependsOn 'checkApiOnly'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
